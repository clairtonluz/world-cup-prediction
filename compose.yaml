name: world-cup-predictor

x-postgres-credentials: &postgres-credentials
  POSTGRES_DB: ${POSTGRES_DB:-world_cup_predictor}
  POSTGRES_USER: ${POSTGRES_USER:-world_cup}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

services:
  database:
    image: postgres:17-alpine
    environment: *postgres-credentials
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrate
    environment:
      <<: *postgres-credentials
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    environment:
      <<: *postgres-credentials
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      AUTH_KEYCLOAK_ID: ${AUTH_KEYCLOAK_ID:?Set AUTH_KEYCLOAK_ID in .env}
      AUTH_KEYCLOAK_SECRET: ${AUTH_KEYCLOAK_SECRET:?Set AUTH_KEYCLOAK_SECRET in .env}
      AUTH_KEYCLOAK_ISSUER: ${AUTH_KEYCLOAK_ISSUER:?Set AUTH_KEYCLOAK_ISSUER in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
