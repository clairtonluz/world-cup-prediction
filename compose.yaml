name: world-cup-predictor

x-postgres-credentials: &postgres-credentials
  POSTGRES_DB: ${POSTGRES_DB:-world_cup_predictor}
  POSTGRES_USER: ${POSTGRES_USER:-world_cup}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

services:
  database:
    image: postgres:17-alpine
    environment: *postgres-credentials
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrate
    environment:
      <<: *postgres-credentials
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    environment:
      <<: *postgres-credentials
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      AUTH_KEYCLOAK_ID: ${AUTH_KEYCLOAK_ID:?Set AUTH_KEYCLOAK_ID in .env}
      AUTH_KEYCLOAK_SECRET: ${AUTH_KEYCLOAK_SECRET:?Set AUTH_KEYCLOAK_SECRET in .env}
      AUTH_KEYCLOAK_ISSUER: ${AUTH_KEYCLOAK_ISSUER:?Set AUTH_KEYCLOAK_ISSUER in .env}
      ESPN_SCOREBOARD_BASE_URL: ${ESPN_SCOREBOARD_BASE_URL:-}
      MATCH_SYNC_SECRET: ${MATCH_SYNC_SECRET:?Set MATCH_SYNC_SECRET in .env}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_MESSAGING_SENDER_ID: ${FIREBASE_MESSAGING_SENDER_ID:-}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
      FIREBASE_MEASUREMENT_ID: ${FIREBASE_MEASUREMENT_ID:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  sync-worker:
    build:
      context: .
      target: runner
    environment:
      MATCH_SYNC_SECRET: ${MATCH_SYNC_SECRET:?Set MATCH_SYNC_SECRET in .env}
      MATCH_SYNC_URL: http://app:3000/api/integrations/score-sync/sync
    command:
      - node
      - scripts/score-sync-worker.mjs
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  backup-worker:
    image: postgres:17-alpine
    environment:
      <<: *postgres-credentials
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      BACKUP_DIR: /backups
      MATCH_START_BACKUP_RETENTION: ${MATCH_START_BACKUP_RETENTION:-10}
      MATCH_START_BACKUP_POLL_INTERVAL_SECONDS: ${MATCH_START_BACKUP_POLL_INTERVAL_SECONDS:-60}
    volumes:
      - ./scripts/database/match-start-backup-worker.sh:/usr/local/bin/match-start-backup-worker.sh:ro
      - ./backups:/backups
    command:
      - sh
      - /usr/local/bin/match-start-backup-worker.sh
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
